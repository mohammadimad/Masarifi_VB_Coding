<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مصاريفي - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <span class="text-white text-3xl">💰</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">مصاريفي</h1>
        <p class="text-gray-500 mt-2">إدارة مصاريفك الشخصية بسهولة</p>
      </div>

      <div class="flex gap-2 mb-6 p-1 bg-gray-100 rounded-lg">
        <button id="login-tab" class="flex-1 py-2 px-4 rounded-lg bg-white shadow-sm text-indigo-600 font-medium">تسجيل الدخول</button>
        <button id="signup-tab" class="flex-1 py-2 px-4 rounded-lg text-gray-500 font-medium">إنشاء حساب</button>
      </div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
          <input type="password" id="password" name="password" required minlength="6"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
        </div>
        <button type="submit" id="submit-btn"
          class="w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors">
          تسجيل الدخول
        </button>
      </form>

      <div id="message" class="mt-4 text-center text-sm hidden"></div>
    </div>
  </div>

  <script type="module">
    import { login, signup, checkSession } from './js/auth.js'

    let isLogin = true

    const loginTab = document.getElementById('login-tab')
    const signupTab = document.getElementById('signup-tab')
    const authForm = document.getElementById('auth-form')
    const submitBtn = document.getElementById('submit-btn')
    const messageDiv = document.getElementById('message')

    async function init() {
      const session = await checkSession()
      if (session) {
        window.location.href = 'index.html'
      }
    }

    function showMessage(text, isError = false) {
      messageDiv.textContent = text
      messageDiv.className = 'mt-4 text-center text-sm ' + (isError ? 'text-red-600' : 'text-green-600')
      messageDiv.classList.remove('hidden')
    }

    loginTab.addEventListener('click', () => {
      isLogin = true
      loginTab.className = 'flex-1 py-2 px-4 rounded-lg bg-white shadow-sm text-indigo-600 font-medium'
      signupTab.className = 'flex-1 py-2 px-4 rounded-lg text-gray-500 font-medium'
      submitBtn.textContent = 'تسجيل الدخول'
    })

    signupTab.addEventListener('click', () => {
      isLogin = false
      signupTab.className = 'flex-1 py-2 px-4 rounded-lg bg-white shadow-sm text-indigo-600 font-medium'
      loginTab.className = 'flex-1 py-2 px-4 rounded-lg text-gray-500 font-medium'
      submitBtn.textContent = 'إنشاء حساب'
    })

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value

      try {
        if (isLogin) {
          await login(email, password)
          window.location.href = 'index.html'
        } else {
          await signup(email, password)
          showMessage('تم إنشاء الحساب بنجاح! تحقق من بريدك الإلكتروني للتفعيل', false)
        }
      } catch (error) {
        showMessage(error.message || 'حدث خطأ', true)
      }
    })

    init()
  </script>
</body>
</html>
