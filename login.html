<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مصاريفي (Masarifi)</title>
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-variant": "#e4e1ee",
            "error": "#ba1a1a",
            "surface-tint": "#4d44e3",
            "surface-container-high": "#eae6f4",
            "secondary": "#5c5f60",
            "on-surface": "#1b1b24",
            "on-surface-variant": "#464555",
            "on-background": "#1b1b24",
            "primary-fixed": "#e2dfff",
            "primary-container": "#4f46e5",
            "on-secondary": "#ffffff",
            "outline": "#777587",
            "error-container": "#ffdad6",
            "on-primary": "#ffffff",
            "primary": "#3525cd",
            "surface": "#fcf8ff",
            "outline-variant": "#c7c4d8",
            "surface-container": "#f0ecf9",
            "surface-container-lowest": "#ffffff",
            "background": "#fcf8ff"
          },
          fontFamily: {
            sans: ["Cairo", "Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4 text-on-surface">
  <main class="w-full max-w-[440px]">
    <!-- Brand / Logo Area -->
    <div class="text-center mb-8">
      <div class="inline-block p-2 bg-white rounded-3xl shadow-sm border border-outline-variant/30 mb-3">
        <img src="assets/logo.png" alt="شعار مصاريفي" class="h-20 w-20 object-contain mx-auto">
      </div>
      <h1 class="text-2xl font-bold text-primary">مصاريفي</h1>
      <p class="text-sm text-on-surface-variant mt-1">إدارة أموالك ومصاريفك بذكاء وسهولة</p>
    </div>

    <!-- Login / Register Card -->
    <div class="bg-surface-container-lowest rounded-2xl shadow-sm p-6 sm:p-8 border border-outline-variant/40">
      <!-- Tabs -->
      <div class="flex p-1 bg-surface-container rounded-xl mb-6">
        <button id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-primary shadow-sm transition-all">
          تسجيل الدخول
        </button>
        <button id="tab-signup" class="flex-1 py-2 text-sm font-semibold rounded-lg text-on-surface-variant hover:text-on-surface transition-all">
          إنشاء حساب
        </button>
      </div>

      <!-- Form -->
      <form id="auth-form" class="space-y-5">
        <!-- Email Field -->
        <div>
          <label class="block text-sm font-medium text-on-surface mb-2" for="email">البريد الإلكتروني</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-outline">
              <span class="material-symbols-outlined text-[20px]">mail</span>
            </div>
            <input 
              class="block w-full rounded-xl border border-outline-variant/70 bg-surface-container-lowest text-on-surface text-sm pr-11 pl-4 py-3 focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none transition-all placeholder:text-outline" 
              dir="ltr" 
              id="email" 
              name="email" 
              placeholder="name@example.com" 
              required 
              type="email"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-sm font-medium text-on-surface mb-2" for="password">كلمة المرور</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-outline">
              <span class="material-symbols-outlined text-[20px]">lock</span>
            </div>
            <input 
              class="block w-full rounded-xl border border-outline-variant/70 bg-surface-container-lowest text-on-surface text-sm pr-11 pl-4 py-3 focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none transition-all placeholder:text-outline" 
              dir="ltr" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              required 
              minlength="6"
              type="password"
            >
          </div>
        </div>

        <!-- Remember Me & Forgot Password (Only shown on login) -->
        <div id="login-options" class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 cursor-pointer text-on-surface-variant">
            <input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember-me" type="checkbox">
            <span>تذكرني</span>
          </label>
          <a class="text-primary hover:underline font-semibold" href="#">
            نسيت كلمة المرور؟
          </a>
        </div>

        <!-- Message Box -->
        <div id="auth-message" class="hidden p-3 rounded-xl text-xs font-medium text-center"></div>

        <!-- Submit Button -->
        <div>
          <button 
            id="auth-submit-btn"
            class="w-full flex justify-center items-center py-3.5 px-4 rounded-xl shadow-sm text-sm font-bold text-on-primary bg-primary-container hover:bg-primary transition-all active:scale-[0.99]" 
            type="submit"
          >
            تسجيل الدخول
          </button>
        </div>
      </form>
    </div>

    <!-- Toggle Notice -->
    <p class="mt-6 text-center text-sm text-on-surface-variant">
      <span id="toggle-text">ليس لديك حساب؟</span>
      <button id="toggle-auth-btn" class="text-primary hover:underline font-bold mr-1 inline-block">
        إنشاء حساب جديد
      </button>
    </p>
  </main>

  <script type="module">
    import { login, signup, checkSession } from './js/auth.js';

    let isLoginMode = true;
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const authForm = document.getElementById('auth-form');
    const submitBtn = document.getElementById('auth-submit-btn');
    const messageDiv = document.getElementById('auth-message');
    const loginOptions = document.getElementById('login-options');
    const toggleText = document.getElementById('toggle-text');
    const toggleAuthBtn = document.getElementById('toggle-auth-btn');

    async function init() {
      const session = await checkSession();
      if (session) {
        window.location.href = 'index.html';
      }
    }

    function setMode(loginMode) {
      isLoginMode = loginMode;
      messageDiv.classList.add('hidden');
      if (isLoginMode) {
        tabLogin.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-primary shadow-sm transition-all';
        tabSignup.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-on-surface-variant hover:text-on-surface transition-all';
        submitBtn.textContent = 'تسجيل الدخول';
        loginOptions.classList.remove('hidden');
        toggleText.textContent = 'ليس لديك حساب؟';
        toggleAuthBtn.textContent = 'إنشاء حساب جديد';
      } else {
        tabSignup.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-primary shadow-sm transition-all';
        tabLogin.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-on-surface-variant hover:text-on-surface transition-all';
        submitBtn.textContent = 'إنشاء الحساب';
        loginOptions.classList.add('hidden');
        toggleText.textContent = 'لديك حساب بالفعل؟';
        toggleAuthBtn.textContent = 'تسجيل الدخول';
      }
    }

    tabLogin.addEventListener('click', () => setMode(true));
    tabSignup.addEventListener('click', () => setMode(false));
    toggleAuthBtn.addEventListener('click', (e) => {
      e.preventDefault();
      setMode(!isLoginMode);
    });

    function showMessage(text, isError = false) {
      messageDiv.textContent = text;
      messageDiv.className = `p-3 rounded-xl text-xs font-medium text-center ${
        isError 
          ? 'bg-red-50 text-error border border-red-200' 
          : 'bg-green-50 text-green-700 border border-green-200'
      }`;
      messageDiv.classList.remove('hidden');
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> جارٍ المعالجة...';

      try {
        if (isLoginMode) {
          await login(email, password);
          showMessage('تم تسجيل الدخول بنجاح! جارٍ التحويل...', false);
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        } else {
          await signup(email, password);
          showMessage('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.', false);
          setTimeout(() => {
            setMode(true);
          }, 1500);
        }
      } catch (err) {
        showMessage(err.message || 'حدث خطأ أثناء معالجة الطلب', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLoginMode ? 'تسجيل الدخول' : 'إنشاء الحساب';
      }
    });

    init();
  </script>
</body>
</html>
