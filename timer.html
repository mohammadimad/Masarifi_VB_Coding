<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مصاريفي - المؤقت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="min-h-screen bg-gray-50">
    <header
      class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-40"
    >
      <div class="max-w-4xl mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <a
              href="index.html"
              class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center hover:bg-indigo-700 transition-colors"
            >
              <span class="text-white text-xl">←</span>
            </a>
            <h1 class="text-xl font-bold text-gray-900">المؤقت</h1>
          </div>
          <button
            id="logout-btn"
            class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 transition-colors"
          >
            تسجيل الخروج
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
      <!-- Timer Section -->
      <div
        class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 mb-8 text-center"
      >
        <div
          id="timer-display"
          class="text-5xl md:text-7xl font-bold text-indigo-600 mb-8"
        >
          00:00:00
        </div>
        <div class="flex justify-center gap-4 flex-wrap">
          <button
            id="start-btn"
            class="px-8 py-3 bg-green-600 text-white font-semibold rounded-xl hover:bg-green-700 transition-colors"
          >
            ▶️ بدء
          </button>
          <button
            id="pause-btn"
            class="px-8 py-3 bg-yellow-500 text-white font-semibold rounded-xl hover:bg-yellow-600 transition-colors hidden"
          >
            ⏸️ إيقاف مؤقت
          </button>
          <button
            id="reset-btn"
            class="px-8 py-3 bg-gray-200 text-gray-700 font-semibold rounded-xl hover:bg-gray-300 transition-colors"
          >
            🔄 إعادة
          </button>
        </div>
      </div>

      <!-- Stats Section -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div
          class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 text-center"
        >
          <div class="text-3xl mb-2">🔥</div>
          <div id="total-sessions" class="text-2xl font-bold text-gray-900">
            0
          </div>
          <div class="text-sm text-gray-500">جلسات كاملة</div>
        </div>
        <div
          class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 text-center"
        >
          <div class="text-3xl mb-2">⏱️</div>
          <div id="total-time" class="text-2xl font-bold text-indigo-600">
            00:00:00
          </div>
          <div class="text-sm text-gray-500">وقت إجمالي</div>
        </div>
        <div
          class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 text-center"
        >
          <div class="text-3xl mb-2">🏆</div>
          <div
            id="achievements-count"
            class="text-2xl font-bold text-yellow-600"
          >
            0
          </div>
          <div class="text-sm text-gray-500">إنجازات</div>
        </div>
      </div>

      <!-- Achievements Section -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-4">الإنجازات</h2>
        <div
          id="achievements-list"
          class="grid grid-cols-1 md:grid-cols-2 gap-3"
        ></div>
      </div>
    </main>

    <script type="module">
      import { initializeTimerApp } from "./js/timer.js";
      initializeTimerApp();
    </script>
  </body>
</html>
