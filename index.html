<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مصاريفي - قائمة المهام</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-gray-50">
  <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
            <span class="text-white text-xl">✅</span>
          </div>
          <h1 class="text-xl font-bold text-gray-900">قائمة المهام</h1>
        </div>
        <button id="logout-btn" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 transition-colors">
          تسجيل الخروج
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
      <form id="add-todo-form" class="flex gap-3 flex-wrap">
        <input type="text" id="todo-input" required placeholder="أضف مهمة جديدة..." 
               class="flex-1 min-w-[200px] px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
        <button type="submit" 
                class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors">
          إضافة
        </button>
      </form>
    </div>

    <div class="flex items-center justify-between mb-6">
      <div class="flex gap-2">
        <button id="filter-all" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">الكل</button>
        <button id="filter-active" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm">الجارية</button>
        <button id="filter-completed" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm">المكتملة</button>
      </div>
      <button id="clear-completed" class="px-4 py-2 text-red-600 text-sm hover:text-red-700 transition-colors">
        مسح المكتملة
      </button>
    </div>

    <div id="todo-list" class="space-y-3"></div>

    <div id="todo-stats" class="mt-8 text-center text-sm text-gray-500"></div>
  </main>

  <script type="module">
    import { initializeTodoApp } from './js/app.js';
    initializeTodoApp();
  </script>
</body>
</html>
