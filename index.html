<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مصاريفي - لوحة التحكم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-gray-50">
  <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
            <span class="text-white text-xl">💰</span>
          </div>
          <h1 class="text-xl font-bold text-gray-900">مصاريفي</h1>
        </div>
        <button id="logout-btn" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 transition-colors">
          تسجيل الخروج
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center">
            <span class="text-green-600">+</span>
          </div>
          <span class="text-gray-500 text-sm">إجمالي الدخل</span>
        </div>
        <p id="total-income" class="text-2xl font-bold text-green-600">0 ج.م</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center">
            <span class="text-red-600">-</span>
          </div>
          <span class="text-gray-500 text-sm">إجمالي المصروفات</span>
        </div>
        <p id="total-expense" class="text-2xl font-bold text-red-600">0 ج.م</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center">
            <span class="text-indigo-600">=</span>
          </div>
          <span class="text-gray-500 text-sm">الرصيد</span>
        </div>
        <p id="balance" class="text-2xl font-bold text-indigo-600">0 ج.م</p>
      </div>
    </div>

    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-semibold text-gray-900">المعاملات</h2>
      <button id="add-transaction-btn"
        class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition-colors flex items-center gap-2">
        <span>+</span>
        معاملة جديدة
      </button>
    </div>

    <div id="transactions-list" class="space-y-3">
      <div class="text-center py-8 text-gray-500">
        <p>جاري التحميل...</p>
      </div>
    </div>
  </main>

  <div id="transaction-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold text-gray-900">إضافة معاملة</h3>
        <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <form id="transaction-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">النوع</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2 p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-green-500 transition-colors">
              <input type="radio" name="type" value="income" checked class="accent-green-600">
              <span class="text-green-600 font-medium">دخل</span>
            </label>
            <label class="flex items-center gap-2 p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-red-500 transition-colors">
              <input type="radio" name="type" value="expense" class="accent-red-600">
              <span class="text-red-600 font-medium">مصروف</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">المبلغ</label>
          <input type="number" name="amount" id="amount" required min="0" step="0.01"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all"
            placeholder="أدخل المبلغ">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">الوصف</label>
          <input type="text" name="description" id="description" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all"
            placeholder="مثال: راتب الشهر، شراء خبز">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">التاريخ</label>
          <input type="date" name="date" id="date"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
        </div>

        <div class="flex gap-3 pt-4">
          <button type="button" id="cancel-btn"
            class="flex-1 py-3 px-4 bg-gray-100 text-gray-700 font-medium rounded-xl hover:bg-gray-200 transition-colors">
            إلغاء
          </button>
          <button type="submit"
            class="flex-1 py-3 px-4 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors">
            إضافة
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from './js/app.js'
    initializeApp()
  </script>
</body>
</html>
